name: Lightning Fast Build ModMenu

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies (ldid & ccache)
        run: |
          brew install ldid ccache
          echo "/opt/homebrew/opt/ccache/libexec" >> $GITHUB_PATH

      - name: Setup Ccache Cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Setup Theos Environment
        run: |
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          echo "THEOS=/opt/theos" >> $GITHUB_ENV
          echo "/opt/theos/bin" >> $GITHUB_PATH

      - name: Build Package with Maximum Speed
        run: |
          export CC="ccache clang"
          export CXX="ccache clang++"
          make package -j$(sysctl -n hw.ncpu)

      - name: Separate and Organize Output Files
        run: |
          mkdir -p final_outputs
          cp packages/*.deb final_outputs/ 2>/dev/null || echo ".deb bulunamadı"
          
          DYLIB_FILE=$(find .theos/obj -name "*.dylib" | head -n 1)
          if [ -n "$DYLIB_FILE" ]; then
            cp "$DYLIB_FILE" final_outputs/
          fi

      - name: Generate Esign Compatible IPA & Inject Dylib
        run: |
          # Temiz bir Payload klasör yapısı oluştur
          rm -rf Payload
          mkdir -p Payload/ModMenuTest.app
          
          # Esign uyumlu kusursuz Info.plist
          cat << 'EOF' > Payload/ModMenuTest.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.test.modmenuapp</string>
              <key>CFBundleName</key>
              <string>ModMenuTest</string>
              <key>CFBundleDisplayName</key>
              <string>ModMenu Test</string>
              <key>CFBundleExecutable</key>
              <string>ModMenuTest</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>MinimumOSVersion</key>
              <string>12.0</string>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
          </dict>
          </plist>
          EOF

          DYLIB_NAME=$(basename final_outputs/*.dylib)
          if [ -f "final_outputs/$DYLIB_NAME" ]; then
            cp "final_outputs/$DYLIB_NAME" Payload/ModMenuTest.app/
            
            # ARM64 mimarisine uygun test binary dosyası derle
            echo 'int main(int argc, char *argv[]){return 0;}' > main.c
            xcrun clang -arch arm64 main.c -o Payload/ModMenuTest.app/ModMenuTest
            
            # Dylib ve binary bağlama ayarları
            install_name_tool -change "$DYLIB_NAME" "@executable_path/$DYLIB_NAME" Payload/ModMenuTest.app/ModMenuTest || true
            install_name_tool -id "@executable_path/$DYLIB_NAME" Payload/ModMenuTest.app/$DYLIB_NAME || true
          fi

          # Doğrudan standart IPA formatında paketle (Esign hatasını önler)
          zip -r ModMenu_Test.ipa Payload
          mv ModMenu_Test.ipa final_outputs/
          rm -rf Payload main.c

      - name: Create Final Clean Zip Archive
        run: |
          cd final_outputs
          zip -r ../ModMenu_Release_Files.zip *
          cd ..

      - name: Upload Final Archive Artifact
        uses: upload-artifact@v4
        with:
          name: ModMenu-Release-Bundle
          path: ModMenu_Release_Files.zip
