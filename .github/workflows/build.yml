name: Build ModMenu, Deb, Dylib and Perfect IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies (ldid)
        run: |
          brew install ldid

      - name: Setup Theos Environment
        run: |
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          echo "THEOS=/opt/theos" >> $GITHUB_ENV
          echo "/opt/theos/bin" >> $GITHUB_PATH

      - name: Build Package with Max Parallel Power
        run: |
          make package -j$(sysctl -n hw.ncpu)

      - name: Separate and Organize Output Files
        run: |
          # Ana çıktı klasörünü oluştur
          mkdir -p final_outputs
          
          # 1. .deb dosyasını kopyala
          cp packages/*.deb final_outputs/ 2>/dev/null || echo ".deb bulunamadı"
          
          # 2. .dylib dosyasını bul ve ayrı olarak kopyala
          DYLIB_FILE=$(find .theos/obj -name "*.dylib" | head -n 1)
          if [ -n "$DYLIB_FILE" ]; then
            cp "$DYLIB_FILE" final_outputs/
            echo ".dylib başarıyla kopyalandı."
          else
            echo "Uyarı: .dylib dosyası bulunamadı."
          fi

      - name: Generate Compatible Test IPA & Inject Dylib
        run: |
          mkdir -p Payload/ModMenuTest.app
          
          cat << 'EOF' > Payload/ModMenuTest.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.test.modmenuapp</string>
              <key>CFBundleName</key>
              <string>ModMenuTest</string>
              <key>CFBundleExecutable</key>
              <string>ModMenuTest</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
          </dict>
          </dict>
          EOF

          DYLIB_NAME=$(basename final_outputs/*.dylib)
          if [ -f "final_outputs/$DYLIB_NAME" ]; then
            # .dylib dosyasını IPA içine de ekle ki uygulama çalıştırabilsin
            cp "final_outputs/$DYLIB_NAME" Payload/ModMenuTest.app/
            
            echo 'int main(int argc, char *argv[]){return 0;}' > main.c
            xcrun clang main.c -o Payload/ModMenuTest.app/ModMenuTest
            
            install_name_tool -change "$DYLIB_NAME" "@executable_path/$DYLIB_NAME" Payload/ModMenuTest.app/ModMenuTest || true
            install_name_tool -id "@executable_path/$DYLIB_NAME" Payload/ModMenuTest.app/$DYLIB_NAME || true
          fi

          # IPA dosyasını oluştur ve final klasörüne taşı
          cd Payload
          zip -r ../ModMenu_Test.ipa *
          cd ..
          mv ModMenu_Test.ipa final_outputs/
          rm -rf Payload main.c

      - name: Create Final Clean Zip Archive
        run: |
          # Her şeyi tek bir düzenli zip içinde topluyoruz
          cd final_outputs
          zip -r ../ModMenu_Release_Files.zip *
          cd ..

      - name: Upload Final Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModMenu-Release-Bundle
          path: ModMenu_Release_Files.zip
