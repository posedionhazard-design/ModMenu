name: Unzip and Cleanup Repository

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  unzip-and-clean:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract İOS.zip and Cleanup
        run: |
          if [ -f "İOS.zip" ]; then
            echo "İOS.zip bulundu, dosyalar çıkarılıyor..."
            unzip -q İOS.zip -d .
            echo "İOS.zip siliniyor..."
            rm İOS.zip
            ls -la
          else
            echo "İOS.zip bulunamadı!"
            exit 1
          fi

      - name: Commit changes to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Çıkan dosyaları ve silinen zip'i git'e ekle
          git add -A
          
          # Değişiklik varsa commit at ve push et
          if git diff --staged --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "chore: Unzip İOS.zip and cleanup archive"
            git push
          fi
