name: Lightning Fast Build ModMenu

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies (ldid, ccache, make & imagemagick)
        run: |
          brew install ldid ccache make imagemagick
          echo "/opt/homebrew/opt/ccache/libexec" >> $GITHUB_PATH

      - name: Setup Ccache Cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Setup Theos Environment
        run: |
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          echo "THEOS=/opt/theos" >> $GITHUB_ENV
          echo "/opt/homebrew/opt/ccache/libexec" >> $GITHUB_PATH

      - name: Build Package with Maximum Speed & Ccache
        run: |
          export CC="ccache clang"
          export CXX="ccache clang++"
          gmake package -j$(sysctl -n hw.ncpu)

      - name: Separate and Organize Output Files
        run: |
          mkdir -p final_outputs
          cp packages/*.deb final_outputs/ 2>/dev/null || echo ".deb bulunamadı"
          
          DYLIB_FILE=$(find .theos/obj -name "*.dylib" | head -n 1)
          if [ -n "$DYLIB_FILE" ]; then
            cp "$DYLIB_FILE" final_outputs/
          fi

      - name: Generate Crash-Proof Simulated Game IPA
        run: |
          rm -rf Payload
          mkdir -p Payload/ModMenuTest.app
          
          # Şık bir ikon üret
          convert -size 180x180 xc:"#1a1a2e" -gravity center -pointsize 40 -fill "#e94560" -annotate +0+0 "MOD" AppIcon60x60@2x.png || true
          if [ -f "AppIcon60x60@2x.png" ]; then
            cp AppIcon60x60@2x.png Payload/ModMenuTest.app/AppIcon60x60@2x.png
          fi

          # Info.plist
          cat << 'EOF' > Payload/ModMenuTest.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.test.modmenuapp</string>
              <key>CFBundleName</key>
              <string>ModMenuTest</string>
              <key>CFBundleDisplayName</key>
              <string>ModMenu Test</string>
              <key>CFBundleExecutable</key>
              <string>ModMenuTest</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>CFBundleIcons</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon60x60</string>
                      </array>
                  </dict>
              </dict>
          </dict>
          </plist>
          EOF

          DYLIB_NAME=$(basename final_outputs/*.dylib)
          if [ -f "final_outputs/$DYLIB_NAME" ]; then
            cp "final_outputs/$DYLIB_NAME" Payload/ModMenuTest.app/
            
            # Uygulamanın anında çökmesini (crash) önleyen, dylib'i güvenle yükleyen C++ ana başlatıcı kodu
            cat << 'EOF' > main.m
            #import <UIKit/UIKit.h>
            #import <dlfcn.h>

            @interface AppDelegate : UIResponder <UIApplicationDelegate>
            @property (strong, nonatomic) UIWindow *window;
            @end

            @implementation AppDelegate
            - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
                self.window = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
                self.window.backgroundColor = [UIColor blackColor];
                
                // Ekrana test menüsünün yüklendiğini belirten bir yazı koyuyoruz ki çökmediğini görebilesiniz
                UILabel *label = [[UILabel alloc] initWithFrame:self.window.bounds];
                label.text = @"Mod Menu Test Aktif!\n(Dylib Yüklendi)";
                label.textColor = [UIColor whiteColor];
                label.textAlignment = NSTextAlignmentCenter;
                label.numberOfLines = 2;
                label.font = [UIFont boldSystemFontOfSize:20];
                [self.window addSubview:label];
                
                [self.window makeKeyAndVisible];
                return YES;
            }
            end

            int main(int argc, char *argv[]) {
                // Dylib dosyasını uygulama ayağa kalkarken güvenli bir şekilde belleğe (handle) yükle
                NSString *dylibPath = [[[NSBundle mainBundle] bundlePath] stringByAppendingPathComponent:@"%DYLIB_PLACEHOLDER%"];
                dlopen([dylibPath cStringUsingEncoding:NSUTF8StringEncoding], RTLD_NOW);
                
                @autoreleasepool {
                    return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
                }
            }
            EOF
            
            # Dinamik olarak dylib ismini kodun içine işleyelim
            sed -i '' "s/%DYLIB_PLACEHOLDER%/$DYLIB_NAME/g" main.m

            # ARM64 mimarisiyle ve gerekli grafik/arayüz kütüphaneleriyle (UIKit, Metal) derle
            xcrun clang -arch arm64 -isysroot $(xcrun --sdk iphoneos --show-sdk-path) -miphoneos-version-min=14.0 -framework UIKit -framework Foundation -framework Metal main.m -o Payload/ModMenuTest.app/ModMenuTest
            
            install_name_tool -change "$DYLIB_NAME" "@executable_path/$DYLIB_NAME" Payload/ModMenuTest.app/ModMenuTest || true
            install_name_tool -id "@executable_path/$DYLIB_NAME" Payload/ModMenuTest.app/$DYLIB_NAME || true
          fi

          zip -r ModMenu_Test.ipa Payload
          mv ModMenu_Test.ipa final_outputs/
          rm -rf Payload main.m AppIcon*.png

      - name: Create Final Clean Zip Archive
        run: |
          cd final_outputs
          zip -r ../ModMenu_Release_Files.zip *
          cd ..

      - name: Upload Final Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModMenu-Release-Bundle
          path: ModMenu_Release_Files.zip
