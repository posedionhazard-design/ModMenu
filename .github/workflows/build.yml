name: Unzip and Cleanup Repository

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  unzip-and-clean:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract baba.zip and Cleanup
        run: |
          # baba.zip veya büyük/küçük harf duyarlılığı olmadan herhangi bir zip dosyasını bul
          ZIP_FILE=$(find . -maxdepth 1 -iname "baba.zip" | head -n 1)
          
          if [ -n "$ZIP_FILE" ]; then
            echo "Bulunan arşiv: $ZIP_FILE, dosyalar çıkarılıyor..."
            unzip -q "$ZIP_FILE" -d .
            echo "Arşiv siliniyor..."
            rm "$ZIP_FILE"
            ls -la
          else
            echo "Hata: Kök dizinde baba.zip dosyası bulunamadı!"
            exit 1
          fi

      - name: Commit changes to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          if git diff --staged --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "chore: Unzip baba.zip and cleanup archive"
            git push
          fi
