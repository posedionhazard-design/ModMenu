name: Build iOS Mod Menu (.deb)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Theos and SDKs
        run: |
          # Daha önceden kalmış olabilecek eski Theos dosyalarını temizle
          sudo rm -rf /opt/theos
          
          # Theos ve SDK'ları sıfırdan klonla
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          sudo git clone https://github.com/theos/sdks.git /opt/theos/sdks

      - name: Setup Theos Environment
        run: |
          echo "THEOS=/opt/theos" >> $GITHUB_ENV
          echo "/opt/theos/bin" >> $GITHUB_PATH

      - name: Build Package with Make
        run: |
          make clean
          make package

      - name: Upload Artifacts (.deb & .dylib)
        uses: actions/upload-artifact@v4
        with:
          name: iOS-ModMenu-Output
          path: |
            packages/*.deb
            .theos/obj/*.dylib
